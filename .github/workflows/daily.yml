name: NSE Daily OHLCV

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. 12:30 UTC = 18:00 IST.
    - cron: "30 12 * * 1-5"
    - cron: "45 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "15 13 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        run: python -m src.init_db

      - name: Collect latest NSE session
        run: python -m src.daily_job

      - name: Update combined 3-year master
        run: python -m src.build_master update

      - name: Build rolling ChatGPT CSV layer
        run: python -m src.build_chatgpt_csv

      - name: Apply 3-year database retention
        run: python -m src.retention --days 1095

      - name: Audit data
        run: python -m src.audit

      - name: Commit new Parquet data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exports data/nse_ohlcv_3year_master.parquet data/chatgpt
          if git diff --cached --quiet; then
            echo "No new Parquet data to commit."
          else
            git commit -m "Update daily NSE OHLCV data"
            git push
          fi
